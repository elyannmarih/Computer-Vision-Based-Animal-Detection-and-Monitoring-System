name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      YOLO_AUTOINSTALL: 'false'
      CAMERA_RTSP_URL: ''
      CAMERA_SAVE_INTERVAL: '0'
      S3_BUCKET: ''
      LIZARD_MODEL: yolov8s-oiv7
      # This credential belongs only to the disposable PostgreSQL service below.
      DETECTRA_TEST_DATABASE_URL: postgresql://detectra:detectra-ci-test-only@127.0.0.1:5432/detectra_test_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: detectra
          POSTGRES_PASSWORD: detectra-ci-test-only
          POSTGRES_DB: detectra_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U detectra -d detectra_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Ubuntu package mirror
        run: |
          # Slow Azure downloads can exhaust the job timeout without triggering APT failover.
          # Keep the official Ubuntu archive and security mirrors supplied by the runner.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      - name: Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - name: Install Python dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/detectra-ci"
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: npm --prefix frontend ci

      - name: Install browser dependencies
        timeout-minutes: 10
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium webkit

      - name: Record installed versions
        run: |
          python --version | tee "$RUNNER_TEMP/detectra-ci/python-version.log"
          node --version | tee "$RUNNER_TEMP/detectra-ci/node-version.log"
          python -m pip freeze > "$RUNNER_TEMP/detectra-ci/python-packages.txt"
          npm --prefix frontend ls --depth=0 > "$RUNNER_TEMP/detectra-ci/frontend-packages.txt"

      - name: Python unit tests
        run: python -m unittest discover -s backend/tests -v 2>&1 | tee "$RUNNER_TEMP/detectra-ci/unit-tests.log"

      - name: Python static analysis
        run: python -m mypy --config-file backend/mypy.ini 2>&1 | tee "$RUNNER_TEMP/detectra-ci/mypy.log"

      - name: PostgreSQL and real inference integration tests
        run: python -m unittest discover -s backend/tests/integration -v 2>&1 | tee "$RUNNER_TEMP/detectra-ci/integration-tests.log"

      - name: ESLint
        run: npm --prefix frontend run lint 2>&1 | tee "$RUNNER_TEMP/detectra-ci/eslint.log"

      - name: TypeScript
        run: npm --prefix frontend run typecheck 2>&1 | tee "$RUNNER_TEMP/detectra-ci/typescript.log"

      - name: Next.js production build
        run: npm --prefix frontend run build 2>&1 | tee "$RUNNER_TEMP/detectra-ci/build.log"

      - name: Browser regression tests
        run: npm --prefix frontend run test:e2e 2>&1 | tee "$RUNNER_TEMP/detectra-ci/browser-tests.log"

      - name: Browser workflows with real backend and YOLO
        run: python backend/tests/run_system.py 2>&1 | tee "$RUNNER_TEMP/detectra-ci/system-tests.log"

      - name: Save test logs and browser failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/detectra-ci/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  delivery:
    name: Docker delivery
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DETECTRA_DB_PASSWORD: ci-build-configuration-only
      DETECTRA_REVISION: ${{ github.sha }}
      DETECTRA_CAMERA_RTSP_URL: ''
      DETECTRA_CAMERA_SAVE_INTERVAL: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install delivery tools
        run: python -m pip install httpx==0.28.1 PyYAML==6.0.3

      - name: Build application images and fetch PostgreSQL
        run: |
          mkdir -p "$RUNNER_TEMP/detectra-delivery-checks"
          docker compose config --quiet
          docker compose build --pull backend frontend 2>&1 | tee "$RUNNER_TEMP/detectra-delivery-checks/build.log"
          docker compose pull db

      - name: Test built images in a disposable project
        run: |
          python backend/tests/run_compose.py --report "$RUNNER_TEMP/detectra-delivery-checks/source-smoke.json" 2>&1 | tee "$RUNNER_TEMP/detectra-delivery-checks/source-smoke.log"

      - name: Package the tested images
        run: |
          python scripts/delivery.py package --output "$RUNNER_TEMP/detectra-delivery" --smoke-report "$RUNNER_TEMP/detectra-delivery-checks/source-smoke.json"

      - name: Verify and load the delivery
        run: python scripts/delivery.py load --bundle "$RUNNER_TEMP/detectra-delivery" 2>&1 | tee "$RUNNER_TEMP/detectra-delivery-checks/load.log"

      - name: Test the packaged Compose configuration
        run: |
          python backend/tests/run_compose.py --compose-file "$RUNNER_TEMP/detectra-delivery/compose.yaml" --report "$RUNNER_TEMP/detectra-delivery-checks/bundle-smoke.json" 2>&1 | tee "$RUNNER_TEMP/detectra-delivery-checks/bundle-smoke.log"

      - name: Upload verified delivery from main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: detectra-${{ github.sha }}-linux-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/detectra-delivery/
          # The only hidden file is the explicitly copied configuration example.
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Save delivery validation logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: delivery-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/detectra-delivery-checks/
          retention-days: 7
          if-no-files-found: warn

name: detectra

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: detectra_dev
      POSTGRES_USER: detectra
      POSTGRES_PASSWORD: ${DETECTRA_DB_PASSWORD:?Set DETECTRA_DB_PASSWORD in .env.compose}
    volumes:
      - database:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U detectra -d detectra_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    image: detectra-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VCS_REF: ${DETECTRA_REVISION:-local}
    environment:
      DATABASE_URL: postgresql://detectra@db:5432/detectra_dev
      PGPASSWORD: ${DETECTRA_DB_PASSWORD:?Set DETECTRA_DB_PASSWORD in .env.compose}
      PUBLIC_API_URL: http://backend:8000
      CORS_ORIGINS: http://localhost:${DETECTRA_WEB_PORT:-3000},http://127.0.0.1:${DETECTRA_WEB_PORT:-3000}
      CAMERA_RTSP_URL: ${DETECTRA_CAMERA_RTSP_URL:-}
      CAMERA_NAME: ${DETECTRA_CAMERA_NAME:-Camera}
      CAMERA_SAVE_INTERVAL: ${DETECTRA_CAMERA_SAVE_INTERVAL:-0}
      S3_BUCKET: ''
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads
      - detector_state:/app/backend/state
    networks: [application, database]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  frontend:
    image: detectra-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VCS_REF: ${DETECTRA_REVISION:-local}
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:${DETECTRA_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_cache:/app/.next/cache
    networks: [application]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  seed:
    profiles: [tools]
    image: detectra-backend:local
    # Share the local database's network namespace to preserve the seed script's loopback-only guard.
    network_mode: service:db
    environment:
      DETECTRA_DEV_DATABASE_URL: postgresql://detectra@127.0.0.1:5432/detectra_dev
      PGPASSWORD: ${DETECTRA_DB_PASSWORD:?Set DETECTRA_DB_PASSWORD in .env.compose}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads
    command: [python, seed.py, --api-base-url, "http://backend:8000"]
    healthcheck:
      disable: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  database:
  uploads:
  detector_state:
  frontend_cache:

networks:
  application:
  database:
    internal: true

[mypy]
files = backend/app, backend/development_db.py, backend/init_db.py, backend/seed.py
mypy_path = backend
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# These libraries do not publish usable type information for this integration.
[mypy-ultralytics.*,boto3.*]
ignore_missing_imports = True
follow_imports = skip
